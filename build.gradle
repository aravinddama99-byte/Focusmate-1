plugins { id 'com.android.application' }
android {
    namespace 'com.focusmate.lms'
    compileSdk 34
    defaultConfig {
        applicationId "com.focusmate.lms"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    // A fixed debug key (committed) so every build, including GitHub Actions, has the SAME SHA-1.
    // Google sign-in only works for an app whose package + SHA-1 is registered in Google Cloud.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
